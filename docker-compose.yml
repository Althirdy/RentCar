services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carrental-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=CarRental@Strong2026
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "CarRental@Strong2026", "-Q", "SELECT 1", "-C"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  db_data:
    name: carrental-db-data