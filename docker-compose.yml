services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: carrental-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "CarRental@Strong2026"
      MSSQL_PID: "Express"
    ports:
      - "1433:1433"
    volumes:
      - db_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "CarRental@Strong2026",
          "-Q",
          "SELECT 1",
          "-C",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./RentCar
      dockerfile: Dockerfile.dev
    container_name: carrental-api
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://0.0.0.0:5074"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=CarRentalDb;User Id=sa;Password=CarRental@Strong2026;TrustServerCertificate=True;"
    ports:
      - "5074:5074"
    volumes:
      - ./RentCar:/src/RentCar
      - api_nuget:/root/.nuget/packages
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5074/health || wget -qO- http://localhost:5074/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ./client
      dockerfile: Dockerfile.dev
    container_name: carrental-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:5074"
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    command: npm run dev:docker -- --hostname 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app
      - web_node_modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
    name: carrental-db-data
  api_nuget:
    name: carrental-api-nuget
  web_node_modules:
    name: carrental-web-node-modules
